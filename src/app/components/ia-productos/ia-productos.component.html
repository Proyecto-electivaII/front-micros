<div class="app-container">
  <!-- Chat Panel -->
  <aside class="agent-log">
    <h2>Agente Admin</h2>
    <div class="log-messages" #logContainer>
      <div 
        *ngFor="let message of messages; let i = index" 
        [class]="message.isUser ? 'user-message' : 'log-message'"
        [style.animation-delay]="i * 0.1 + 's'">
        {{ message.text }}
      </div>
    </div>
    <div class="chat-input-container">
      <input 
        type="text" 
        #chatInput
        [(ngModel)]="userInput"
        (keydown)="onInputKeyDown($event)"
        placeholder="Escribe tu petición y presiona Enter..."
        class="chat-input">
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="product-display">
      
      <!-- Loading State -->
      <div *ngIf="currentView === 'loading'" class="loading-text">
        <i class="fas fa-spinner fa-spin me-2"></i>
        Consultando al agente...
      </div>

      <!-- Error State -->
      <div *ngIf="currentView === 'error'" class="error-text">
        <i class="fas fa-exclamation-triangle me-2"></i>
        {{ errorMessage }}
      </div>

      <!-- Products Grid -->
      <div *ngIf="currentView === 'products'" class="product-grid">
        <div 
          *ngFor="let product of products; let i = index" 
          class="product-card"
          [style.animation-delay]="i * 0.1 + 's'">
          <span>{{ product.nombre }}</span>
        </div>
      </div>

      <!-- Product Detail -->
      <div *ngIf="currentView === 'product-detail'" class="product-detail">
        <h3>{{ selectedProduct.nombre }}</h3>
        <p><strong>Precio:</strong> {{ formatPrice(selectedProduct.precio) }}</p>
      </div>

    </div>
  </main>
</div>
